<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="profile-card">

            <!-- Student Profile -->
            <div class="profile-header">
                <div class="profile-icon">🎓</div>

                <h1>Student Profile</h1>
                <p>Academic Performance Card</p>
            </div>

            <!-- Student Details -->
            <div class="student-details">

                <div class="input-group">
                    <label>Student Name</label>
                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name"
                    >
                </div>

                <div class="input-group">
                    <label>Roll Number</label>
                    <input
                        type="text"
                        id="rollNumber"
                        placeholder="Enter roll number"
                    >
                </div>

                <div class="input-group">
                    <label>Department</label>
                    <input
                        type="text"
                        id="department"
                        placeholder="Enter department"
                    >
                </div>

            </div>

            <!-- Marks -->
            <h2>Enter Marks</h2>

            <div class="marks">

                <div class="input-group">
                    <label>HTML</label>
                    <input
                        type="number"
                        id="html"
                        min="0"
                        max="100"
                        placeholder="0 - 100"
                    >
                </div>

                <div class="input-group">
                    <label>CSS</label>
                    <input
                        type="number"
                        id="css"
                        min="0"
                        max="100"
                        placeholder="0 - 100"
                    >
                </div>

                <div class="input-group">
                    <label>JavaScript</label>
                    <input
                        type="number"
                        id="javascript"
                        min="0"
                        max="100"
                        placeholder="0 - 100"
                    >
                </div>

            </div>

            <button id="calculateBtn" class="calculate-btn">
                Calculate Grade
            </button>

            <!-- Result -->
            <div id="result" class="result">

                <div class="result-header">
                    <h2>Student Result</h2>
                </div>

                <div class="result-info">

                    <p>
                        <strong>Name:</strong>
                        <span id="displayName">-</span>
                    </p>

                    <p>
                        <strong>Roll Number:</strong>
                        <span id="displayRoll">-</span>
                    </p>

                    <p>
                        <strong>Department:</strong>
                        <span id="displayDepartment">-</span>
                    </p>

                </div>

                <div class="result-grid">

                    <div>
                        <span>Total Marks</span>
                        <strong id="total">0</strong>
                    </div>

                    <div>
                        <span>Percentage</span>
                        <strong id="percentage">0%</strong>
                    </div>

                    <div>
                        <span>Grade</span>
                        <strong id="grade">-</strong>
                    </div>

                </div>

                <div id="status" class="status">
                    Enter marks to calculate result
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
