<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Counter App</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="counter-card">

            <div class="icon">🔢</div>

            <h1>Counter App</h1>

            <p class="subtitle">
                Web Interface Project
            </p>

            <div class="count-box">
                <span id="count">0</span>
            </div>

            <div class="buttons">

                <button id="decrease" class="decrease">
                    −
                </button>

                <button id="reset" class="reset">
                    Reset
                </button>

                <button id="increase" class="increase">
                    +
                </button>

            </div>

            <p id="message" class="message">
                Start counting!
            </p>

        </div>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
